<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Homepage!</title>
  <link href="./style.css" rel="stylesheet">
</head>
<body>
  <div id="column-one">
    <div id="sign-in-wrapper">
      <span id="sign-in-tagline">Not Signed In <a href="./assets/screenshot.png">View Screenshot</a> <a href="https://github.com/bea-ee/homepage">Github for Project</a></span>
      <form>
        <input type="email" name="email" autocomplete="email" id="email-input" placeholder="Email...">
        <input type="password" name="password" autocomplete="current-password" id="password-input" placeholder="Password...">
        <button type="button" id="sign-in">Sign In</button>
      </form>
      <button id="sign-out">Sign Out</button>
    </div>
    <!-- Bubbles aren't that useful
    <input id="bubbles-input" autocomplete="off" type="text" placeholder="Bubble description...">
    <div id="bubbles">
      <div class="bubble"><img src="./assets/plus.svg"></div>
      <script type="module" src="./bubbles.js"></script>
    </div>
    -->
    <div id="calendar">
      <iframe src="https://calendar.google.com/calendar/embed?height=1200&wkst=1&ctz=America%2FNew_York&showPrint=0&showTitle=0&showCalendars=0&showTz=0&mode=WEEK&src=YmVhLmVlMzE0QGdtYWlsLmNvbQ&src=MzUzZmM4NzYxZDRkMGIxMDI3ZDI4YmEzOWEwMDliMjcxNTNmYTY4N2I3NzAwNGE5NTRiNGRiNzM2MTljYTJiZUBncm91cC5jYWxlbmRhci5nb29nbGUuY29t&src=bXIzYTV1ZDlyY2RkYmttdGQ5cmwxMjFwM2t2NWpxOXFAaW1wb3J0LmNhbGVuZGFyLmdvb2dsZS5jb20&src=ZW4udXNhI2hvbGlkYXlAZ3JvdXAudi5jYWxlbmRhci5nb29nbGUuY29t&color=%23bbd7ff&color=%236fffb1&color=%236fdbff&color=%23ffffff"></iframe>
      <div id="cover"></div>
    </div>
  </div>
  <div id="column-two">
    <div id="list">
      <div id="list-input-wrapper">
        <input type="text" placeholder="Add to the todo list!" id="list-input">
        <button>Today</button><button>Tomorrow</button><button>明後日</button><button>Week</button><button>Weeklong</button><button>Month</button>
      </div>
      <div id="list-tags-wrapper">
        <label><input type="checkbox" name="tags-due">Due</label><label><input type="checkbox" name="tags-important">Important</label><label><input type="checkbox" name="tags-todo">Todo</label><label><input type="checkbox" name="tags-completed" checked>Completed</label></div> <!-- Load bearing lack of newline -->
      <ul id="list-content">
      <script type="module" src="./list.js"></script>
    </div>
  </div>
  <script type="module" src="./main.js"></script>
  <script type="module" src="./search.js"></script>
</body>
</html>
